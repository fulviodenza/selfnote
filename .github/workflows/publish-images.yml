name: Build & publish images

# Builds the api / sync / web / operator images and pushes them to the GitHub
# Container Registry (ghcr.io/<owner>/selfnote-*). Runs on pushes to main (tags
# `latest` + a short SHA), on version tags `v*` (semver tags), and on demand.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: selfnote-api
            dockerfile: server/api/Dockerfile
            context: .
          - image: selfnote-sync
            dockerfile: server/sync/Dockerfile
            context: .
          - image: selfnote-web
            dockerfile: apps/web/Dockerfile
            context: .
          - image: selfnote-operator
            dockerfile: operator/Dockerfile
            context: operator
          - image: selfnote-mcp
            dockerfile: tools/mcp-server/Dockerfile
            context: tools/mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # The cluster runs amd64; add linux/arm64 here (with QEMU) if you need it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
