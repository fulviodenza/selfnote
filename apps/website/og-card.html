<!doctype html>
<!-- The social card behind /assets/og.png, rendered at 1200x630 and screenshotted.
     Not shipped in the image and not in the sitemap; it exists so the PNG can be
     regenerated when the message changes. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&family=Inter+Tight:wght@400..700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #f3f3f0; color: #1b1d22; font-family: "Inter Tight", sans-serif; }
    .card { position: relative; width: 1200px; height: 630px; padding: 72px 84px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 600; }
    .brand img { width: 44px; height: 44px; }
    h1 { font-family: "Source Serif 4", Georgia, serif; font-size: 84px; line-height: 1.04; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 24px; max-width: 980px; }
    p { font-size: 32px; line-height: 1.3; color: #606670; margin: 0; max-width: 900px; }
    .foot { display: flex; justify-content: space-between; align-items: flex-end; font-size: 24px; color: #606670; }
    .foot b { color: #2b44c7; font-weight: 600; }
    .rule { position: absolute; left: 84px; right: 84px; top: 148px; height: 2px; background: #e2e1dc; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="/assets/logo.png" alt="" />Selfnote</div>
    <div class="rule"></div>
    <div>
      <h1>Your notes, on your server.</h1>
      <p>A self-hosted, open source Notion alternative: real-time collaboration that works offline, tasks, links, and AI on your own terms.</p>
    </div>
    <div class="foot"><span>Free and open source · web, desktop and mobile</span><b>selfnote.fulvio.dev</b></div>
  </div>
</body>
</html>
