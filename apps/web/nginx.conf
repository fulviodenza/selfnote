server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sync WebSocket -> sync service (same namespace). Preserves /ws/<doc> path.
    location /ws/ {
        proxy_pass http://selfnote-sync:4444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API -> api service. Trailing slash strips the /api prefix.
    location /api/ {
        proxy_pass http://selfnote-api:4445/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Stream Server-Sent Events (/api/ai/chat/stream) straight through — without
        # this, nginx buffers the response and the AI chat arrives all at once.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are content-addressed — cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must always revalidate, or a stale copy keeps pointing browsers at
    # old bundles after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
