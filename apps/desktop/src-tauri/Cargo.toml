[package]
name = "selfnote-desktop"
version = "0.1.0"
edition = "2021"
description = "Selfnote desktop app (Tauri shell over the shared web client)"

# Detached from the root Cargo workspace so Tauri's heavy dependency tree does not
# slow down `cargo build --workspace` for the backend crates.
[workspace]

[lib]
name = "selfnote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
