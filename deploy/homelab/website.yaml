# Selfnote marketing/docs website, in the default namespace next to cloudflared.
# Expose it by adding a Cloudflare tunnel route -> http://selfnote-website.default.svc:80
#
# The image tag below is an example. A merge to main that touches apps/website
# builds the image and rolls this deployment to its sha-<short> tag
# (.github/workflows/release-images.yml), so the live tag is always a commit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selfnote-website
  namespace: default
  labels: { app: selfnote-website }
spec:
  replicas: 1
  selector:
    matchLabels: { app: selfnote-website }
  template:
    metadata:
      labels: { app: selfnote-website }
    spec:
      imagePullSecrets: [{ name: harbor }]
      containers:
        - name: web
          image: registry.fulvio.dev/selfnote/selfnote-website:sha-0000000
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: selfnote-website
  namespace: default
spec:
  selector: { app: selfnote-website }
  ports:
    - port: 80
      targetPort: 80
