apiVersion: v1
kind: Secret
metadata:
  name: {{ include "selfnote.fullname" . }}-app
  labels:
    {{- include "selfnote.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  ROOM_SECRET: {{ .Values.secrets.roomSecret | quote }}
{{- if eq (include "selfnote.aiManagesSecret" .) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "selfnote.aiSecretName" . }}
  labels:
    {{- include "selfnote.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.ai.provider "claude-cli" }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ required "ai.claudeCodeOauthToken is required for provider claude-cli (or set ai.existingSecret)" .Values.ai.claudeCodeOauthToken | quote }}
  {{- else if eq .Values.ai.provider "anthropic" }}
  ANTHROPIC_API_KEY: {{ required "ai.anthropicApiKey is required for provider anthropic (or set ai.existingSecret)" .Values.ai.anthropicApiKey | quote }}
  {{- end }}
{{- end }}
{{- if .Values.minio.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "selfnote.minioName" . }}
  labels:
    {{- include "selfnote.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.rootPassword | quote }}
  # Consumed by CloudNativePG's barmanObjectStore for backups.
  ACCESS_KEY_ID: {{ .Values.minio.rootUser | quote }}
  ACCESS_SECRET_KEY: {{ .Values.minio.rootPassword | quote }}
{{- end }}
