{{- $pgSecret := printf "%s-app" (include "selfnote.pgClusterName" .) -}}
{{- $appSecret := printf "%s-app" (include "selfnote.fullname" .) -}}
# ---------------- sync server ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "selfnote.fullname" . }}-sync
  labels:
    {{- include "selfnote.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync
spec:
  replicas: {{ .Values.sync.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sync
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: sync
    spec:
      containers:
        - name: sync
          image: {{ include "selfnote.image" (dict "Values" .Values "Chart" .Chart "component" .Values.sync.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.sync.port }}
          env:
            - name: SYNC_ADDR
              value: "0.0.0.0:{{ .Values.sync.port }}"
            - name: SYNC_REQUIRE_AUTH
              value: {{ ternary "1" "0" .Values.sync.requireAuth | quote }}
            - name: ROOM_SECRET
              valueFrom: { secretKeyRef: { name: {{ $appSecret }}, key: ROOM_SECRET } }
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $pgSecret }}, key: uri } }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.sync.port }} }
          resources: {{- toYaml .Values.sync.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "selfnote.fullname" . }}-sync
  labels:
    {{- include "selfnote.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sync
  ports:
    - { port: {{ .Values.sync.port }}, targetPort: {{ .Values.sync.port }} }
---
# ---------------- api server ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "selfnote.fullname" . }}-api
  labels:
    {{- include "selfnote.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: {{ include "selfnote.image" (dict "Values" .Values "Chart" .Chart "component" .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: API_ADDR
              value: "0.0.0.0:{{ .Values.api.port }}"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ $appSecret }}, key: JWT_SECRET } }
            - name: ROOM_SECRET
              valueFrom: { secretKeyRef: { name: {{ $appSecret }}, key: ROOM_SECRET } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $pgSecret }}, key: uri } }
            {{- if .Values.ai.enabled }}
            {{- $ai := .Values.ai }}
            {{- $aiSecret := include "selfnote.aiSecretName" . }}
            {{- if $ai.model }}
            - name: SELFNOTE_AI_MODEL
              value: {{ $ai.model | quote }}
            {{- end }}
            {{- if $ai.cmd }}
            - name: SELFNOTE_AI_CMD
              value: {{ $ai.cmd | quote }}
            {{- end }}
            {{- if $ai.args }}
            - name: SELFNOTE_AI_ARGS
              value: {{ $ai.args | quote }}
            {{- end }}
            {{- if eq $ai.provider "claude-cli" }}
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $aiSecret }}, key: CLAUDE_CODE_OAUTH_TOKEN } }
            {{- else if eq $ai.provider "anthropic" }}
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: {{ $aiSecret }}, key: ANTHROPIC_API_KEY } }
            {{- else if eq $ai.provider "ollama" }}
            - name: OLLAMA_HOST
              value: {{ required "ai.ollamaHost is required for provider ollama" $ai.ollamaHost | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.api.port }} }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "selfnote.fullname" . }}-api
  labels:
    {{- include "selfnote.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - { port: {{ .Values.api.port }}, targetPort: {{ .Values.api.port }} }
---
# ---------------- web client ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "selfnote.fullname" . }}-web
  labels:
    {{- include "selfnote.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: {{ include "selfnote.image" (dict "Values" .Values "Chart" .Chart "component" .Values.web.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
          env:
            - name: WEB_SYNC_URL
              value: {{ .Values.web.syncUrl | quote }}
            - name: WEB_API_URL
              value: {{ .Values.web.apiUrl | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "selfnote.fullname" . }}-web
  labels:
    {{- include "selfnote.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - { port: {{ .Values.web.port }}, targetPort: {{ .Values.web.port }} }
