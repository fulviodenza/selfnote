# In-cluster image build and push.
#
# Why in-cluster rather than from a laptop:
#
#  * The nodes are amd64, which is what the cluster runs, so there is no
#    cross-compilation. The API is a Rust release build; cross-compiling that
#    from an arm64 Mac through QEMU is slow enough to discourage deploying at
#    all, which is its own kind of problem.
#  * `registry.fulvio.dev` sits behind Cloudflare, which caps upload size, so a
#    push of anything large dies with 413 (see README.md, which documents the
#    port-forward workaround this replaces). Pushing to the Harbor service
#    inside the cluster never touches Cloudflare. `hostAliases` below points the
#    real hostname at Harbor's ClusterIP, so the image is pushed under exactly
#    the name the cluster pulls, with TLS verifying normally.
#
# Placeholders, substituted by the wrapper in README.md:
#   __IMAGE__    selfnote-api | selfnote-sync | selfnote-web | selfnote-website
#                | selfnote-operator | selfnote-mcp
#   __TAG__      the new version, e.g. 0.1.15
#   __REF__      the commit to build; use a merged main SHA, never a branch
#   __NAME__     a DNS-safe job name
#   __HARBOR_IP__  Harbor's ClusterIP: kubectl get svc harbor -n harbor -o jsonpath='{.spec.clusterIP}'
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  namespace: ci
spec:
  # A failed build wants reading, not retrying: the usual causes (a compile
  # error, a tag that already exists) do not get better on a second attempt.
  backoffLimit: 0
  # A day, not an hour: the whole point of not retrying is that someone reads
  # the logs, and an hour deletes the evidence of an evening build before
  # anybody looks at it.
  ttlSecondsAfterFinished: 86400
  # Nothing retries and nothing else will notice a wedged buildkitd or a stalled
  # fetch, so the build has to be able to give up on its own rather than holding
  # a node's CPU and disk indefinitely. The Rust release build is the long pole
  # at roughly four minutes; forty is generous.
  activeDeadlineSeconds: 2400
  template:
    spec:
      restartPolicy: Never
      # homelab-3 to homelab-6 have 8Gi and run application workloads; a Rust
      # release build landing beside selfnote-api and hitting the node's memory
      # takes the node down rather than just failing. homelab-2 has 20Gi and is
      # already the build node for the APK runner. The cost is that a build and
      # an APK build serialise, which for infrequent manual builds is the right
      # trade against evicting the API.
      nodeSelector:
        kubernetes.io/hostname: homelab-2
      # Resolve the real registry hostname to Harbor's in-cluster service.
      #
      # This is what lets the push use `registry.fulvio.dev` verbatim: the
      # certificate then matches, so TLS verifies normally, and Harbor's token
      # service (a second endpoint, which `registry.insecure` does not cover and
      # which fails the handshake if the name does not match) is happy too. The
      # connection goes straight to the ClusterIP, so Cloudflare and its upload
      # cap are never involved. The address is substituted at apply time rather
      # than committed, since a ClusterIP is a property of the cluster.
      hostAliases:
        - ip: "__HARBOR_IP__"
          hostnames: ["registry.fulvio.dev"]
      containers:
        - name: build
          image: moby/buildkit:v0.17.2-rootless
          securityContext:
            # Rootless buildkit sets up its own user namespaces, which these
            # allow. It does not need a privileged container, unlike the dind
            # sidecars the GitHub runners use.
            seccompProfile: { type: Unconfined }
            appArmorProfile: { type: Unconfined }
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: IMAGE
              value: "__IMAGE__"
            - name: TAG
              value: "__TAG__"
            - name: REF
              value: "__REF__"
            - name: BUILDKITD_FLAGS
              value: --oci-worker-no-process-sandbox
            - name: HOME
              value: /home/user
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
              # The Rust target dir, node_modules, and every exported layer land
              # on the node's disk.
              ephemeral-storage: 8Gi
            limits:
              memory: 12Gi
              ephemeral-storage: 24Gi
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              # The same secret the cluster already uses to pull. Docker config
              # is keyed by registry host, and hostAliases above means the host
              # really is registry.fulvio.dev, so it is used as-is.
              #
              # That account needs push rights on selfnote/*, not just pull:
              # README.md creates this secret as a pull secret, and a pull-scoped
              # robot would fail at the export step after the whole build has
              # run. The account in use has been confirmed to push.
              mkdir -p "$HOME/.docker"
              cp /harbor/.dockerconfigjson "$HOME/.docker/config.json"

              # Harbor serves a certificate signed by its own CA. Externally
              # that never shows, because Cloudflare terminates TLS with a
              # public certificate; talking to the service directly, it does.
              # Append the CA to the system bundle and point Go at the result,
              # which is the part that has to be done as a non-root user.
              cat /etc/ssl/certs/ca-certificates.crt /harbor-ca/ca.crt \
                > "$HOME/ca-bundle.crt"
              export SSL_CERT_FILE="$HOME/ca-bundle.crt"

              # BuildKit fetches the repository itself, so this needs no git
              # binary and no clone step. The repo is public, so no credentials.
              REPO=https://github.com/fulviodenza/selfnote.git
              # Contexts match what each Dockerfile expects: the api, sync and
              # web images are built from the repo root, the others from their
              # own directory. Kept in step with the matrix in
              # .github/workflows/publish-images.yml.
              case "$IMAGE" in
                selfnote-api)      CONTEXT="$REPO#$REF";                  FILE=server/api/Dockerfile ;;
                selfnote-sync)     CONTEXT="$REPO#$REF";                  FILE=server/sync/Dockerfile ;;
                selfnote-web)      CONTEXT="$REPO#$REF";                  FILE=apps/web/Dockerfile ;;
                selfnote-website)  CONTEXT="$REPO#$REF:apps/website";     FILE=Dockerfile ;;
                selfnote-operator) CONTEXT="$REPO#$REF:operator";         FILE=Dockerfile ;;
                selfnote-mcp)      CONTEXT="$REPO#$REF:tools/mcp-server"; FILE=Dockerfile ;;
                *) echo "unknown image: $IMAGE" >&2; exit 1 ;;
              esac

              echo "building $IMAGE:$TAG from $REF ($FILE)"
              exec buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --opt context="$CONTEXT" \
                --opt filename="$FILE" \
                --output "type=image,name=registry.fulvio.dev/selfnote/$IMAGE:$TAG,push=true" \
                --progress plain
          volumeMounts:
            - name: harbor
              mountPath: /harbor
              readOnly: true
            - name: harbor-ca
              mountPath: /harbor-ca
              readOnly: true
            # The rootless image declares this a VOLUME, which Kubernetes
            # ignores, so without it the build cache and every exported layer
            # accumulate in the container's writable layer on the node's disk.
            # A couple of api builds on one node is enough to cause
            # DiskPressure and evict unrelated pods.
            - name: buildkit
              mountPath: /home/user/.local/share/buildkit
      volumes:
        - name: harbor
          secret:
            secretName: harbor
        # Harbor's CA, copied into this namespace because secrets do not cross
        # namespaces and a CA certificate is public material anyway:
        #   kubectl get secret harbor-nginx -n harbor -o jsonpath='{.data.ca\.crt}' \
        #     | base64 -d > ca.crt
        #   kubectl create configmap harbor-ca -n ci --from-file=ca.crt
        - name: harbor-ca
          configMap:
            name: harbor-ca
        - name: buildkit
          emptyDir:
            sizeLimit: 20Gi
