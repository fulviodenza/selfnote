# Self-hosted GitHub Actions runner for fulviodenza/selfnote, in the homelab
# `ci` namespace alongside the runners for the other repos. Drives
# .github/workflows/mobile-apk.yml.
#
# Scrubbed example, like deploy/homelab/*.yaml: the cluster is the source of
# truth. The registration token below is a placeholder and must not be
# committed with a real value. See deploy/ci/README.md for the bootstrap.
#
# Differences from the other runners in this namespace, all deliberate:
#   - a custom image carrying the Android toolchain, not the stock runner
#   - 40Gi of state instead of 5Gi, because GRADLE_USER_HOME lives on it
#     (local-path cannot expand a claim, hence a new one rather than a resize)
#   - no dind sidecar: nothing here builds images, so nothing needs privileged
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: github-runner-selfnote-state
  namespace: ci
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
# The registration Secret is deliberately NOT in this file. It holds a one-time
# token created out of band (see README), and a placeholder here would win the
# apply and overwrite the real value, leaving the pod in CrashLoopBackOff on a
# token config.sh rejects. Create it with kubectl before applying this.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner-selfnote
  namespace: ci
  labels:
    app: github-runner-selfnote
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the state PVC is ReadWriteOnce, so a second
  # pod would sit Pending on a volume the outgoing one still holds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: github-runner-selfnote
  template:
    metadata:
      labels:
        app: github-runner-selfnote
    spec:
      # Namespace-scoped, so the one in `selfnote`/`default` does not count:
      # the README creates it in `ci` too. Without it the image is an
      # ImagePullBackOff, since Harbor will not serve it anonymously.
      imagePullSecrets: [{ name: harbor }]
      # local-path binds the volume to whichever node the pod first lands on,
      # so that node is worth choosing rather than inheriting from the
      # scheduler. homelab-2 has 20Gi against the 8Gi of homelab-3..6, which is
      # what makes the memory limit below meaningful instead of unreachable.
      nodeSelector:
        kubernetes.io/hostname: homelab-2
      containers:
        - name: runner
          image: registry.fulvio.dev/selfnote/android-runner:sdk52
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              cd /home/runner
              # First boot registers with the one-time token and copies the
              # credentials onto the PVC; every later boot restores them, so a
              # restart does not need a fresh token.
              if [ ! -f state/.runner ]; then
                ./config.sh --unattended \
                  --url https://github.com/fulviodenza/selfnote \
                  --token "${RUNNER_REG_TOKEN}" \
                  --name k3s-home-selfnote \
                  --labels self-hosted,home \
                  --replace
                # Not `|| true` on these two: if the copy fails (a full PVC,
                # say) the registration is lost, and the only symptom is a
                # re-register against an expired token one restart later.
                cp -a .runner .credentials state/
                # config.sh writes this one, but not on every runner version.
                cp -a .credentials_rsaparams state/ 2>/dev/null || true
              else
                cp -a state/.runner state/.credentials .
                cp -a state/.credentials_rsaparams . 2>/dev/null || true
              fi
              exec ./run.sh
          env:
            - name: RUNNER_REG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-selfnote-reg
                  key: token
                  optional: true
            # Gradle and npm caches live on the PVC so a build reuses them.
            # Without this every run re-downloads the whole dependency graph on
            # a 4-CPU node.
            - name: GRADLE_USER_HOME
              value: /home/runner/state/gradle
            - name: npm_config_cache
              value: /home/runner/state/npm
          resources:
            requests:
              cpu: 500m
              # Requesting 4Gi keeps the scheduler off the 8Gi nodes when they
              # are already loaded; Gradle plus Metro will use most of it.
              memory: 4Gi
            limits:
              memory: 12Gi
          volumeMounts:
            - name: state
              mountPath: /home/runner/state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: github-runner-selfnote-state
